# Promtail — coleta logs dos containers Docker e envia ao Loki.
# Complementa o transport pino-loki (que cobre API/worker rodando no host em dev);
# aqui pegamos os containers da stack (postgres, redis, etc.) e, em produção,
# também API/worker quando rodarem como containers.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
