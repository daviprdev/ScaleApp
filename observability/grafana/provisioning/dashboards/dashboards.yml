# Provider de dashboards: carrega os JSONs de /var/lib/grafana/dashboards.
apiVersion: 1

providers:
  - name: ScaleApp
    orgId: 1
    folder: ScaleApp
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
